<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能产品选型工具</title>
    <style>
        :root {
            --primary-color: #00338D;
            --primary-hover: #002266;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
            --error-color: #d9534f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* TAB 切换样式 */
        .tab-nav {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 25px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background-color: #f0f4f9;
            border-radius: 6px 6px 0 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #444;
        }

        .form-group select, .form-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: var(--primary-color);
        }

        /* 气体下拉框样式 */
        .search-select-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            font-weight: normal;
            font-size: 15px;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background-color: #fff;
            border: 1px solid var(--primary-color);
            border-top: none;
            border-radius: 0 0 6px 6px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: normal;
            color: #222;
            border-bottom: 1px solid #f0f0f0;
        }

        .dropdown-item:hover {
            background-color: #f0f4f9;
            color: var(--primary-color);
        }

        .flow-input-group {
            display: flex;
            gap: 10px;
        }

        .flow-input-group input {
            flex: 2;
        }

        .flow-input-group select {
            flex: 1;
        }

        /* 选型结果卡片 */
        .result-box {
            margin-top: 35px;
            background-color: #f8fafc;
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .model-code {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 1.5px;
            font-family: 'Courier New', Courier, monospace;
            word-break: break-all;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 16px;
            font-weight: bold;
        }

        .bin-info {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .copy-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--primary-hover);
        }

        .copy-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>蓝动选型工具</h1>
    <p class="subtitle">根据不同产品架构切换选型模式，自动精准生成型号编码</p>

    <!-- 系列 Tab 切换 -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchSeries('GT1')">GT-110 系列</button>
        <button class="tab-btn" onclick="switchSeries('GT1020')">GT-1000 / 2000 系列</button>
        <button class="tab-btn" onclick="switchSeries('PT')">PT 系列 (变送器)</button>
        <button class="tab-btn" onclick="switchSeries('PS')">PS 系列 (压力开关)</button>
        <button class="tab-btn" onclick="switchSeries('TARGETS')">TARGETS 系列</button>
    </div>

    <!-- ===== GT-1 系列界面表单 ===== -->
    <div id="formGT1" class="form-grid">
        <div class="form-group">
            <label>产品系列与型号</label>
            <input type="text" value="GT-1 (标准型)" disabled>
        </div>

        <div class="form-group">
            <label for="gasSearchGT1">选择/搜索气体</label>
            <div class="search-select-container">
                <input type="text" id="gasSearchGT1" class="search-input" placeholder="输入气体名称 (如: N2, He)..." autocomplete="off" onfocus="showGasList('GT1')" oninput="filterGases('GT1')">
                <div class="dropdown-list" id="gasDropdownGT1"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="flowValueGT1">输入满量程流量</label>
            <div class="flow-input-group">
                <input type="number" id="flowValueGT1" value="30" placeholder="例如: 30" oninput="updateModel()">
                <select id="flowUnitGT1" onchange="updateModel()">
                    <option value="SCCM" selected>SCCM</option>
                    <option value="SLM">SLM</option>
                </select>
            </div>
            <div class="bin-info" id="flowDetailGT1">匹配代号: 11 (N2)</div>
        </div>

        <div class="form-group">
            <label for="valveGT1">阀门类型</label>
            <select id="valveGT1" onchange="updateModel()">
                <option value="NC" selected>NC: 常闭</option>
                <option value="MT">MT: 流量计 (无阀)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="portGT1">气路接口</label>
            <select id="portGT1" onchange="updateModel()">
                <option value="VS" selected>VS: Body 1-1/8", 124 mm 1/4" VCR</option>
                <option value="SW">SW: Body 1-1/2", 127 mm 1/4" Swagelok</option>
            </select>
        </div>

        <div class="form-group">
            <label for="protocolGT1">通信协议</label>
            <select id="protocolGT1" onchange="updateModel()">
                <option value="ES" selected>ES: EtherCAT, Side of case, 5-pin M8</option>
                <option value="RT">RT: RS485/Analog, Top of case, 9-Pin Type D</option>
                <option value="DS">DS: DeviceNet, Side of case, 5-pin M12</option>
            </select>
        </div>
    </div>

    <!-- ===== GT-10/20 系列界面表单 ===== -->
    <div id="formGT1020" class="form-grid" style="display:none;">
        <div class="form-group">
            <label for="modelGT1020">型号代码</label>
            <select id="modelGT1020" onchange="onGTModelChange()">
                <option value="10">GT-10 (标准型)</option>
                <option value="20" selected>GT-20 (压力不敏感型)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gasSearchGT1020">选择/搜索气体</label>
            <div class="search-select-container">
                <input type="text" id="gasSearchGT1020" class="search-input" placeholder="输入气体名称 (如: N2, He)..." autocomplete="off" onfocus="showGasList('GT1020')" oninput="filterGases('GT1020')">
                <div class="dropdown-list" id="gasDropdownGT1020"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="flowValueGT1020">输入满量程流量 (Full Scale Flow)</label>
            <div class="flow-input-group">
                <input type="number" id="flowValueGT1020" value="1" placeholder="例如: 1000" oninput="updateModel()">
                <select id="flowUnitGT1020" onchange="updateModel()">
                    <option value="SLM" selected>SLM</option>
                    <option value="SCCM">SCCM</option>
                </select>
            </div>
            <div class="bin-info" id="binDetail">匹配代号: Bin 04</div>
        </div>

        <div class="form-group">
            <label for="valveGT1020">阀门类型</label>
            <select id="valveGT1020" onchange="updateModel()">
                <option value="NC" selected>NC - 常闭</option>
                <option value="NO">NO - 常开</option>
                <option value="MT">MT - 流量计 (无阀)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="portGT1020">气路接口</label>
            <select id="portGT1020" onchange="updateModel()">
                <option value="VS" selected>VS - Body 1-1/8", 124 mm 1/4" VCR</option>
                <option value="CX">CX - Body 1-1/8", 92 mm C-SEAL</option>
                <option value="WX">WX - Body 1-1/8", 92 mm W-SEAL</option>
            </select>
        </div>

        <div class="form-group">
            <label for="protocolGT1020">通信协议</label>
            <select id="protocolGT1020" onchange="updateModel()">
                <option value="RT">RT - RS485/Analog, Top, 9-Pin Type D</option>
                <option value="DT">DT - DeviceNet, Top, 5-Pin M12</option>
                <option value="DS">DS - DeviceNet, Side, 5-Pin M12</option>
                <option value="ES" selected>ES - EtherCAT, Side, 5-Pin M8</option>
            </select>
        </div>
    </div>

    <!-- ===== PT 系列高纯压力变送器表单 ===== -->
    <div id="formPT" class="form-grid" style="display:none;">
        <div class="form-group">
            <label>I. 产品系列 & II. 类型</label>
            <input type="text" value="PT-8 (高纯压力变送器 - 玻璃微熔式)" disabled>
        </div>

        <div class="form-group">
            <label for="ptMat">III. 膜片材料</label>
            <select id="ptMat" onchange="updateModel()">
                <option value="000" selected>000 - 316L VIM / VAR</option>
                <option value="001">001 - 哈氏合金</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ptPort">IV. 气路接口</label>
            <select id="ptPort" onchange="updateModel()">
                <option value="W1">W1 - 1.5" W-SEAL</option>
                <option value="W2" selected>W2 - 1.125" W-SEAL</option>
                <option value="C1">C1 - 1.5" C-SEAL</option>
                <option value="C2">C2 - 1.125" C-SEAL</option>
                <option value="V1">V1 - Fixed 1/4" Male Face Seal</option>
                <option value="VF">VF - 1/4" Swivel Female Face Seal</option>
                <option value="VM">VM - 1/4" Swivel Male Face Seal</option>
                <option value="VV">VV - Fixed 1/4" Male Face Seal Flow-Through</option>
                <option value="FF">FF - 1/4" Swivel Female Face Seal Flow-Through</option>
                <option value="MM">MM - 1/4" Swivel Male Face Seal Flow-Through</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ptOrient">V. 线缆方向</label>
            <select id="ptOrient" onchange="updateModel()">
                <option value="PL">PL - 平行气路</option>
                <option value="VT" selected>VT - 垂直气路</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ptAnalog">VI. 模拟输出信号</label>
            <select id="ptAnalog" onchange="updateModel()">
                <option value="005" selected>005 - 0 ~ 5 V DC</option>
                <option value="010">010 - 0 ~ 10 V DC</option>
                <option value="105">105 - 1 ~ 5 V DC</option>
                <option value="510">510 - 5 ~ 10 V DC</option>
                <option value="420">420 - 4 ~ 20 mA DC</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ptSwitch">VII. 开关量类型</label>
            <select id="ptSwitch" onchange="updateModel()">
                <option value="N2" selected>N2 - 2路 NPN</option>
                <option value="P2">P2 - 2路 PNP</option>
                <option value="N1">N1 - 1路 NPN</option>
                <option value="P1">P1 - 1路 PNP</option>
                <option value="NO">NO - NONE</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ptElec">VIII. 电气接口</label>
            <select id="ptElec" onchange="updateModel()">
                <option value="D15" selected>D15 - D-Sub 15PIN</option>
                <option value="P09">P09 - Pigtail 9 PIN</option>
                <option value="P06">P06 - Pigtail 6 PIN</option>
                <option value="P05">P05 - Pigtail 5 PIN</option>
                <option value="P04">P04 - Pigtail 4 PIN</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ptRange">IX. 测量类型和量程</label>
            <select id="ptRange" onchange="updateModel()">
                <option value="A1" selected>A1 - 0 ~ 75 psi 绝压</option>
                <option value="A2">A2 - 0 ~ 100 psi 绝压</option>
                <option value="A3">A3 - 0 ~ 150 psi 绝压</option>
                <option value="G1">G1 - 0 ~ 75 psi 表压</option>
                <option value="G2">G2 - 0 ~ 100 psi 表压</option>
                <option value="G3">G3 - 0 ~ 150 psi 表压</option>
                <option value="R1">R1 - -14.5 ~ 75 psi 复合压</option>
                <option value="R2">R2 - -14.5 ~ 100 psi 复合压</option>
                <option value="R3">R3 - -14.5 ~ 150 psi 复合压</option>
            </select>
        </div>
    </div>

    <!-- ===== PS 系列高纯压力开关表单 ===== -->
    <div id="formPS" class="form-grid" style="display:none;">
        <div class="form-group">
            <label>I. 产品系列 & II. 类型</label>
            <input type="text" value="PS-7 (高纯压力开关 - 扩散硅式)" disabled>
        </div>

        <div class="form-group">
            <label for="psMat">III. 膜片材料</label>
            <select id="psMat" onchange="updateModel()">
                <option value="000" selected>000 - 316L</option>
                <option value="001">001 - 哈氏合金</option>
            </select>
        </div>

        <div class="form-group">
            <label for="psPort">IV. 气路接口</label>
            <select id="psPort" onchange="updateModel()">
                <option value="W2" selected>W2 - 1.125" W-SEAL</option>
                <option value="C2">C2 - 1.125" C-SEAL</option>
                <option value="V1">V1 - Fixed 1/4" Male Face Seal</option>
            </select>
        </div>

        <div class="form-group">
            <label for="psSwitch">V. 开关量类型</label>
            <select id="psSwitch" onchange="updateModel()">
                <option value="N" selected>N - NPN</option>
                <option value="P">P - PNP</option>
                <option value="R">R - Solid State Relay Type</option>
            </select>
        </div>

        <div class="form-group">
            <label for="psElec">VI. 电气接口</label>
            <select id="psElec" onchange="updateModel()">
                <option value="M05" selected>M05 - M12 Connector 5 pin</option>
                <option value="D09">D09 - D-Sub 9 Pin</option>
            </select>
        </div>

        <div class="form-group">
            <label for="psAlarm">VII. 报警模式</label>
            <select id="psAlarm" onchange="updateModel()">
                <option value="L" selected>L - 低于压力设定值报警</option>
                <option value="H">H - 高于压力设定值报警</option>
                <option value="X">X - 可配置报警模式</option>
            </select>
        </div>

        <div class="form-group">
            <label for="psPoint">VIII. 压力报警点</label>
            <select id="psPoint" onchange="updateModel()">
                <option value="380" selected>380 - 压力报警点 Torr</option>
                <option value="XXX">XXX - 可配置</option>
            </select>
        </div>
    </div>

    <!-- ===== TARGETS 系列流量比例控制器表单 ===== -->
    <div id="formTARGETS" class="form-grid" style="display:none;">
        <div class="form-group">
            <label>I. 产品系列</label>
            <input type="text" value="TARGETS (流量比例控制器)" disabled>
        </div>

        <div class="form-group">
            <label for="targetsChannels">II. 通道数量</label>
            <select id="targetsChannels" onchange="updateModel()">
                <option value="2" selected>2 - 2通道</option>
                <option value="3">3 - 3通道</option>
                <option value="4">4 - 4通道</option>
                <option value="N">N - N通道 (定制规格)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="targetsRange">III. 单通道量程</label>
            <select id="targetsRange" onchange="updateModel()">
                <option value="005">005 - 500 SCCM</option>
                <option value="010" selected>010 - 1000 SCCM</option>
                <option value="020">020 - 2000 SCCM</option>
                <option value="030">030 - 3000 SCCM</option>
                <option value="100">100 - 10000 SCCM</option>
            </select>
        </div>

        <div class="form-group">
            <label for="targetsValve">IV. 阀门类型</label>
            <select id="targetsValve" onchange="updateModel()">
                <option value="NC" selected>NC - 常闭</option>
                <option value="NO">NO - 常开</option>
            </select>
        </div>

        <div class="form-group">
            <label for="targetsProtocol">V. 通信协议</label>
            <select id="targetsProtocol" onchange="updateModel()">
                <option value="DT" selected>DT - DeviceNet, Top of case, 5-Pin M12</option>
                <option value="DS">DS - DeviceNet, Side of case, 5-Pin M12</option>
                <option value="ET">ET - EtherCAT, Top of case, 5-Pin M8</option>
                <option value="ES">ES - EtherCAT, Side of case, 5-Pin M8</option>
            </select>
        </div>
    </div>

    <!-- 结果展示 -->
    <div class="result-box">
        <div class="result-title">自动匹配的产品型号编码</div>
        <div class="model-code" id="resultCode">GT-111-NC-VS-ES,N2,30SCCM</div>
        <button class="copy-btn" id="copyBtn" onclick="copyCode()">复制完整型号</button>
    </div>
</div>

    function switchSeries(series) {
        activeSeries = series;
        const btns = document.querySelectorAll('.tab-btn');
        btns[0].classList.toggle('active', series === 'GT1');
        btns[1].classList.toggle('active', series === 'GT1020');
        btns[2].classList.toggle('active', series === 'PT');
        btns[3].classList.toggle('active', series === 'PS');
        btns[4].classList.toggle('active', series === 'TARGETS');

        document.getElementById('formGT1').style.display = (series === 'GT1') ? 'grid' : 'none';
        document.getElementById('formGT1020').style.display = (series === 'GT1020') ? 'grid' : 'none';
        document.getElementById('formPT').style.display = (series === 'PT') ? 'grid' : 'none';
        document.getElementById('formPS').style.display = (series === 'PS') ? 'grid' : 'none';
        document.getElementById('formTARGETS').style.display = (series === 'TARGETS') ? 'grid' : 'none';

        if (series === 'GT1020') {
            onGTModelChange();
        } else {
            updateModel();
        }
    }

    // 根据选择的 GT-10 或 GT-20 型号动态更新气路接口下拉选项
    function onGTModelChange() {
        const modelVal = document.getElementById('modelGT1020').value;
        const portSelect = document.getElementById('portGT1020');
        const currentSelected = portSelect.value;

        // 根据型号选择可选的气路接口选项数组
        const allowedPorts = (modelVal === '20') ? gt1020Ports.restricted : gt1020Ports.all;

        portSelect.innerHTML = '';
        allowedPorts.forEach(port => {
            const opt = document.createElement('option');
            opt.value = port.value;
            opt.textContent = port.text;
            portSelect.appendChild(opt);
        });

        // 重新设置选中的接口（若原本选中的接口仍在可选项中则保留，否则默认选中第一个）
        if (allowedPorts.some(p => p.value === currentSelected)) {
            portSelect.value = currentSelected;
        } else {
            portSelect.value = allowedPorts[0].value;
        }

        updateModel();
    }

    function showGasList(type) {
        renderGasDropdown(type, gasesList);
        document.getElementById('gasDropdown' + type).style.display = 'block';
    }

    function filterGases(type) {
        const input = document.getElementById('gasSearch' + type).value.toLowerCase().trim();
        const filtered = gasesList.filter(g => 
            g.symbol.toLowerCase().includes(input) || 
            g.name.toLowerCase().includes(input)
        );
        renderGasDropdown(type, filtered);
        document.getElementById('gasDropdown' + type).style.display = 'block';
    }

    function renderGasDropdown(type, list) {
        const dropdown = document.getElementById('gasDropdown' + type);
        dropdown.innerHTML = '';
        
        if (list.length === 0) {
            dropdown.innerHTML = '<div class="dropdown-item" style="color:#999; font-weight:normal;">未找到匹配气体</div>';
            return;
        }

        list.forEach(gas => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerText = gas.symbol;
            item.onclick = function() {
                selectGas(type, gas);
            };
            dropdown.appendChild(item);
        });
    }

    function selectGas(type, gas) {
        currentSelectedGas = gas;
        document.getElementById('gasSearchGT1').value = gas.symbol;
        document.getElementById('gasSearchGT1020').value = gas.symbol;
        document.getElementById('gasDropdown' + type).style.display = 'none';
        updateModel();
    }

    document.addEventListener('click', function(e) {
        ['GT1', 'GT1020'].forEach(type => {
            const container = document.getElementById('gasSearch' + type);
            const dropdown = document.getElementById('gasDropdown' + type);
            if (container && dropdown && !container.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    });

    function getSccmValue(valueId, unitId) {
        const val = parseFloat(document.getElementById(valueId).value);
        if (isNaN(val) || val <= 0) return 0;
        const unit = document.getElementById(unitId).value;
        return unit === 'SLM' ? val * 1000 : val;
    }

    function updateModel() {
        const resultCodeElem = document.getElementById('resultCode');
        const copyBtn = document.getElementById('copyBtn');

        if (activeSeries === 'GT1') {
            const sccm = getSccmValue('flowValueGT1', 'flowUnitGT1');
            const valve = document.getElementById('valveGT1').value;
            const port = document.getElementById('portGT1').value;
            const protocol = document.getElementById('protocolGT1').value;
            const detailElem = document.getElementById('flowDetailGT1');

            const rawFlowVal = document.getElementById('flowValueGT1').value || '0';
            const flowUnit = document.getElementById('flowUnitGT1').value;
            const gasSymbol = currentSelectedGas ? currentSelectedGas.symbol : '';

            if (sccm <= 0) {
                resultCodeElem.innerHTML = '<span class="error-msg">请输入有效的流量值</span>';
                detailElem.innerText = '匹配代号: 无';
                copyBtn.disabled = true;
                return;
            }

            // 1. 获取当前气体 Bin1 的最小流量下限
            let minBinVal = Infinity;
            for (let range of Object.values(currentSelectedGas.bins)) {
                if (range[0] < minBinVal) minBinVal = range[0];
            }

            // 2. 匹配选定气体的 Bin 范围
            let matchedBin = null;
            if (sccm < minBinVal) {
                matchedBin = '0X';
            } else {
                for (let [binKey, range] of Object.entries(currentSelectedGas.bins)) {
                    if (sccm >= range[0] && sccm <= range[1]) {
                        matchedBin = binKey;
                        break;
                    }
                }
            }

            if (!matchedBin) {
                resultCodeElem.innerHTML = `<span class="error-msg">流量超出 ${gasSymbol} 的 Bin 范围</span>`;
                detailElem.innerText = '匹配代号: 超出范围';
                copyBtn.disabled = true;
                return;
            }

            // 3. 将 0X/01~08/09 等统一转换为 GT-110 的 1X/11~18/19 等格式
            let gt1Code = (matchedBin === '0X') ? '1X' : ('1' + parseInt(matchedBin, 10));

            detailElem.innerText = `匹配代号: ${gt1Code} (${gasSymbol})`;
            // 逗号前后无空格: GT-111-NC-VS-ES,N2,30SCCM
            resultCodeElem.innerText = `GT-1${gt1Code}-${valve}-${port}-${protocol},${gasSymbol},${rawFlowVal}${flowUnit}`;
            copyBtn.disabled = false;

        } else if (activeSeries === 'GT1020') {
            const model = document.getElementById('modelGT1020').value;
            const sccm = getSccmValue('flowValueGT1020', 'flowUnitGT1020');
            const valve = document.getElementById('valveGT1020').value;
            const port = document.getElementById('portGT1020').value;
            const protocol = document.getElementById('protocolGT1020').value;
            const binDetailElem = document.getElementById('binDetail');

            const rawFlowVal = document.getElementById('flowValueGT1020').value || '0';
            const flowUnit = document.getElementById('flowUnitGT1020').value;
            const gasSymbol = currentSelectedGas ? currentSelectedGas.symbol : '';

            if (sccm <= 0) {
                resultCodeElem.innerHTML = '<span class="error-msg">请输入有效的流量值</span>';
                binDetailElem.innerText = '匹配代号: 无';
                copyBtn.disabled = true;
                return;
            }

            let minBinVal = Infinity;
            for (let range of Object.values(currentSelectedGas.bins)) {
                if (range[0] < minBinVal) minBinVal = range[0];
            }

            let matchedBin = null;
            if (sccm < minBinVal) {
                matchedBin = '0X';
            } else {
                for (let [binKey, range] of Object.entries(currentSelectedGas.bins)) {
                    if (sccm >= range[0] && sccm <= range[1]) {
                        matchedBin = binKey;
                        break;
                    }
                }
            }

            if (!matchedBin) {
                resultCodeElem.innerHTML = `<span class="error-msg">流量超出 ${gasSymbol} 的 Bin 范围</span>`;
                binDetailElem.innerText = '匹配代号: 超出范围';
                copyBtn.disabled = true;
                return;
            }

            let formattedBin = (matchedBin === '0X') ? '0X' : (matchedBin.length === 1 ? '0' + matchedBin : matchedBin);
            binDetailElem.innerText = `匹配代号: Bin ${formattedBin} (${currentSelectedGas.symbol})`;
            // 逗号前后无空格: ,气体,量程
            resultCodeElem.innerText = `GT-${model}${formattedBin}-${valve}-${port}-${protocol},${gasSymbol},${rawFlowVal}${flowUnit}`;
            copyBtn.disabled = false;

        } else if (activeSeries === 'PT') {
            const mat = document.getElementById('ptMat').value;
            const port = document.getElementById('ptPort').value;
            const orient = document.getElementById('ptOrient').value;
            const analog = document.getElementById('ptAnalog').value;
            const sw = document.getElementById('ptSwitch').value;
            const elec = document.getElementById('ptElec').value;
            const range = document.getElementById('ptRange').value;

            resultCodeElem.innerText = `PT-8${mat}-${port}${orient}${analog}${sw}${elec}${range}`;
            copyBtn.disabled = false;

        } else if (activeSeries === 'PS') {
            const mat = document.getElementById('psMat').value;
            const port = document.getElementById('psPort').value;
            const sw = document.getElementById('psSwitch').value;
            const elec = document.getElementById('psElec').value;
            const alarm = document.getElementById('psAlarm').value;
            const point = document.getElementById('psPoint').value;

            resultCodeElem.innerText = `PS-7${mat}-${port}${sw}${elec}-${alarm}-${point}`;
            copyBtn.disabled = false;

        } else if (activeSeries === 'TARGETS') {
            const ch = document.getElementById('targetsChannels').value;
            const range = document.getElementById('targetsRange').value;
            const valve = document.getElementById('targetsValve').value;
            const protocol = document.getElementById('targetsProtocol').value;

            resultCodeElem.innerText = `TARGETS-${ch}-${range}-${valve}-${protocol}`;
            copyBtn.disabled = false;
        }
    }

    function copyCode() {
        const codeText = document.getElementById('resultCode').innerText;
        if (!codeText || codeText.includes('超出') || codeText.includes('有效')) return;

        navigator.clipboard.writeText(codeText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '复制成功！';
            copyBtn.style.backgroundColor = '#28a745';
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = 'var(--primary-color)';
            }, 1500);
        });
    }

    window.onload = function() {
        document.getElementById('gasSearchGT1').value = currentSelectedGas.symbol;
        document.getElementById('gasSearchGT1020').value = currentSelectedGas.symbol;
        onGTModelChange();
    };
</script>
